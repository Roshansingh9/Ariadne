[project]
name = "ariadne"
version = "0.1.0"
description = "Repository intelligence: code graphs in FalkorDB Cloud with graph-grounded Q&A via the Meta Model API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Exact pins = the versions the offline and live suites passed against.
# Transitive versions are locked in uv.lock (Vercel installs from it).
dependencies = [
    "fastapi==0.162.0",
    "falkordb==1.8.1",
    "httpx==0.28.1",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_falkordb: talks to a real FalkorDB (set ARIADNE_LIVE_FALKORDB=1)",
    "live_meta: calls the real Meta Model API (set ARIADNE_LIVE_META=1)",
]

[tool.setuptools.packages.find]
include = ["ariadne*"]
